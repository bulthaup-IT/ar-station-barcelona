<title>AR Station</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden;
    font-family: "Helvetica Neue", Arial, sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; overscroll-behavior: none; }
  body.kiosk { cursor: none; }

  /* Bühne: Querformat 4:3 oder Hochformat 3:4 je nach Station */
  #stage { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); overflow: hidden; background: #2b2b2b;
    width: min(100vw, 133.333vh); aspect-ratio: 4 / 3; }
  body.portrait #stage { width: min(100vw, 75vh); aspect-ratio: 3 / 4; }
  body.cover #stage { width: max(100vw, 133.333vh); }
  body.cover.portrait #stage { width: max(100vw, 75vh); }
  body.drawing #stage { touch-action: none; }
  #video, #fallback, #svg, #grid { position: absolute; inset: 0; width: 100%; height: 100%; }
  #video { object-fit: cover; }
  #fallback { display: none; object-fit: cover; background: linear-gradient(160deg, #3a3a3a, #1d1d1d); }
  #svg, #grid { pointer-events: none; }
  #grid { display: none; }
  #grid.show { display: block; }

  #overlay { filter: drop-shadow(0 0 4px rgba(0,0,0,.55)); }
  .line { stroke-width: 8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .lbl { font-size: 40px; font-weight: 500; paint-order: stroke; stroke: rgba(0,0,0,.55); stroke-width: 8px; }
  .draft { stroke: #00e5ff; stroke-width: 3; fill: none; }
  .draftpt { fill: #00e5ff; }

  #caption { position: fixed; left: 0; right: 0; bottom: max(28px, env(safe-area-inset-bottom));
    text-align: center; padding: 0 5vw; pointer-events: none; opacity: 0; transition: opacity .5s; }
  #caption span { display: inline-block; max-width: 900px; padding: 14px 28px;
    background: rgba(0,0,0,.58); font-size: clamp(20px, 2.6vw, 38px); line-height: 1.25; letter-spacing: .01em; }

  #start { position: fixed; inset: 0; z-index: 50; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; background: #151515; text-align: center; padding: 6vw; }
  #start h1 { margin: 0; font-weight: 300; font-size: clamp(28px, 4vw, 56px); }
  #start p { margin: 0; max-width: 640px; font-size: clamp(16px, 1.8vw, 24px); line-height: 1.4; color: #bbb; }
  #start button { margin-top: 10px; padding: 16px 34px; font-size: 22px; color: #111; background: #fff; border: 0; }
  #startAlt { background: transparent !important; color: #999 !important; font-size: 16px !important; text-decoration: underline; padding: 6px !important; }

  #corner { position: fixed; left: 0; top: 0; width: 110px; height: 110px; z-index: 60; }

  /* PIN */
  #pin { position: fixed; inset: 0; z-index: 95; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.85); }
  #pin.show { display: flex; }
  #pin .box { background: #1b1b1b; padding: 20px; width: 300px; text-align: center; }
  #pinDots { font-size: 34px; letter-spacing: 12px; min-height: 44px; margin-bottom: 10px; }
  #pin .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  #pin .keys button { padding: 18px 0; font-size: 24px; background: #333; color: #fff; border: 0; }
  #pin .keys button.k0 { grid-column: 2; }

  /* Menü */
  #calib { position: fixed; right: 12px; top: 12px; z-index: 70; width: min(370px, 94vw);
    max-height: calc(100vh - 24px); overflow-y: auto; display: none; cursor: default;
    background: rgba(20,20,20,.95); padding: 16px; font-size: 15px; -webkit-overflow-scrolling: touch;
    -webkit-user-select: text; user-select: text; }
  #calib.show { display: block; }
  #calib.hidden { display: none !important; }
  #calib h2 { margin: 0 0 8px; font-size: 17px; font-weight: 500; }
  #calib h2.sec { margin-top: 20px; padding-top: 14px; border-top: 1px solid #444; }
  #calib label { display: block; margin: 9px 0 2px; color: #ccc; }
  #calib input[type=range], #calib select { width: 100%; }
  #calib select { padding: 8px; font-size: 15px; }
  #calib .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  #calib button { flex: 1 1 45%; padding: 11px 8px; font-size: 15px; background: #fff; border: 0; color: #111; }
  #calib button.alt { background: #444; color: #fff; }
  #calib button.warn { background: #7a1d1d; color: #fff; }
  #calib textarea { width: 100%; height: 120px; margin-top: 10px; font: 12px/1.3 Consolas, monospace;
    background: #111; color: #9f9; border: 1px solid #444; }
  #status { font: 13px/1.5 Consolas, monospace; color: #aaa; background: #111; padding: 8px; white-space: pre-wrap; }
  #hint { margin-top: 10px; color: #8fe; font-size: 14px; min-height: 1.3em; }

  #mini { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(8px, env(safe-area-inset-bottom));
    z-index: 75; display: none; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap;
    width: max-content; max-width: 96vw; padding: 8px; background: rgba(20,20,20,.94); }
  #mini select, #mini button { font-size: 15px; padding: 10px 12px; border: 0; }
  #mini select { background: #fff; color: #111; max-width: 30vw; }
  #mini button { background: #fff; color: #111; }
  #mini button.alt { background: #444; color: #fff; }
  #mini.top { bottom: auto; top: max(8px, env(safe-area-inset-top)); }
  #mini .mh { flex: 1 1 100%; text-align: center; color: #8fe; font-size: 13px; min-height: 1.2em; }

  /* Lupe beim Zeichnen */
  #loupe { position: fixed; z-index: 80; width: 200px; height: 200px; border-radius: 50%; display: none;
    border: 3px solid #00e5ff; box-shadow: 0 0 12px rgba(0,0,0,.7); pointer-events: none; background: #000; }

  #snapView { position: fixed; inset: 0; z-index: 90; display: none; flex-direction: column; align-items: center;

  #snapView img { max-width: 100%; max-height: 78vh; border: 1px solid #555; }
  #snapView button { padding: 12px 24px; background: #fff; color: #111; border: 0; font-size: 16px; }

  @media (prefers-reduced-motion: reduce) { #caption { transition: none; } }
</style>
</head>
<body class="kiosk">

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <img id="fallback" alt="">
  <svg id="svg" viewBox="0 0 1440 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <g id="overlay">
      <g id="anim"></g>
      <g id="existing" style="display:none"></g>
      <g id="draft"></g>
    </g>
  </svg>
  <svg id="grid" viewBox="0 0 1440 1080" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <g id="gridlines" stroke="rgba(0,255,255,.7)" stroke-width="2"></g>
  </svg>
</div>

<div id="caption"><span></span></div>

<div id="start">
  <h1>Kamera starten</h1>
  <p id="startMsg">Tippen, um das Kamerabild zu aktivieren. Der Ablauf startet danach automatisch und läuft endlos.</p>
  <button id="startBtn" type="button">Starten</button>
  <button id="startAlt" type="button" style="display:none">Ohne Kamera fortfahren</button>
</div>

<div id="corner"></div>

<div id="pin">
  <div class="box">
    <div style="margin-bottom:8px;color:#bbb">PIN eingeben</div>
    <div id="pinDots"></div>
    <div class="keys">
      <button type="button">1</button><button type="button">2</button><button type="button">3</button>
      <button type="button">4</button><button type="button">5</button><button type="button">6</button>
      <button type="button">7</button><button type="button">8</button><button type="button">9</button>
      <button type="button" data-k="x">✕</button><button type="button">0</button><button type="button" data-k="b">⌫</button>
    </div>
  </div>
</div>

<div id="calib">
  <h2>Gerät</h2>
  <label>Station dieses iPads</label>
  <select id="station"></select>
  <div id="status" style="margin-top:10px"></div>

  <h2 class="sec">Ausrichtung</h2>
  <label>Horizontal: <b id="vx"></b></label>
  <input id="rx" type="range" min="-600" max="600" step="1">
  <label>Vertikal: <b id="vy"></b></label>
  <input id="ry" type="range" min="-600" max="600" step="1">
  <label>Skalierung: <b id="vs"></b></label>
  <input id="rs" type="range" min="0.5" max="1.5" step="0.002">
  <label>Drehung: <b id="vr"></b>°</label>
  <input id="rr" type="range" min="-10" max="10" step="0.05">
  <label><input id="gridToggle" type="checkbox"> Hilfsraster anzeigen</label>
  <div class="row"><button id="reset" type="button" class="alt">Ausrichtung zurücksetzen</button></div>

  <h2 class="sec">Zeichnen</h2>
  <label><input id="dActive" type="checkbox"> Zeichenmodus aktiv (Animation pausiert)</label>
  <label>Schritt</label>
  <select id="dStep"></select>
  <label>Werkzeug</label>
  <select id="dTool">
    <option value="line">Linie (2 Punkte)</option>
    <option value="dim">Maßlinie mit Text (2 Punkte)</option>
    <option value="rect">Rahmen (2 Ecken)</option>
    <option value="poly">Linienzug (beliebig viele Punkte)</option>
    <option value="free">Freihandlinie (mit dem Finger ziehen)</option>
    <option value="par">Parallele zu bestehender Linie</option>
    <option value="text">Beschriftung (1 Punkt)</option>
  </select>
  <label>Farbe</label>
  <select id="dColor"></select>
  <label><input id="dSnap" type="checkbox"> Waagerecht/senkrecht einrasten (±4°)</label>
  <div class="row">
    <button id="dFinish" type="button" class="alt">Linienzug abschließen</button>
    <button id="dUndo" type="button" class="alt">Rückgängig</button>
  </div>
  <div id="hint"></div>

  <h2 class="sec">Referenzbild (Ersatz bei Kameraausfall)</h2>
  <div class="row">
    <button id="refSave" type="button">Referenzbild speichern</button>
    <button id="refShow" type="button" class="alt">Ansehen</button>
  </div>
  <label><input id="fbTest" type="checkbox"> Kameraausfall simulieren</label>

  <h2 class="sec">Sicherung</h2>
  <div class="row">
    <button id="exp" type="button">Exportieren (AirDrop)</button>
    <button id="imp" type="button">Importieren</button>
    <button id="dCode" type="button" class="alt">Code anzeigen</button>
    <button id="dClear" type="button" class="warn">Station löschen</button>
  </div>
  <input id="impFile" type="file" style="display:none">
  <textarea id="dOut" readonly placeholder="Code zum Einfügen in CONFIG.stations[n].drawn"></textarea>

  <div class="row" style="margin-top:20px">
    <button id="dReload" type="button" class="alt">Neu laden</button>
    <button id="done" type="button">Schließen</button>
  </div>
</div>

<div id="mini">
  <select id="mStep"></select>
  <select id="mTool">
    <option value="line">Linie</option>
    <option value="dim">Maßlinie</option>
    <option value="rect">Rahmen</option>
    <option value="poly">Linienzug</option>
    <option value="free">Freihand</option>
    <option value="par">Parallele</option>
    <option value="text">Text</option>
  </select>
  <select id="mColor"></select>
  <button id="mUndo" type="button" class="alt">Zurück</button>
  <button id="mFinish" type="button">Abschließen</button>
  <button id="mMenu" type="button" class="alt">Menü</button>
  <button id="mPos" type="button" class="alt" title="Leiste nach oben/unten">⇅</button>
  <div class="mh" id="mHint"></div>
</div>

<canvas id="loupe" width="400" height="400"></canvas>

<div id="snapView">
  <img id="snapImg" alt="Referenzbild">
  <div id="snapInfo"></div>
  <button id="snapClose" type="button">Schließen</button>
</div>

<script>
/* =====================================================================
   KONFIGURATION
   Querformat: Koordinaten 1440 x 1080 · Hochformat: 1080 x 1440
   Gezeichnete Einblendungen entstehen vor Ort im Zeichenmodus.
   ===================================================================== */
var CONFIG = {
  version: "7.4-test (2026-10-16)",
  pin: "1234",                  // PIN für das Menü. "" = ohne PIN
  langs: ["de"],                // Sprache(n). Mehrere Einträge = Wechsel je Durchlauf, z. B. ["de", "en"]
  fit: "contain",               // "contain" = ganzes Bild sichtbar | "cover" = Bildschirm füllen
  showCaptions: false,          // Untertitel (Position/Schritt) im Ablauf anzeigen: true | false
  freehandSmooth: 4,            // Glättung der Freihandlinie (größer = ruhiger, weniger Details)
  pause: 2.5,                   // Sekunden Pause am Ende jedes Durchlaufs
  fadeOut: 0.6,
  colors: [
    { name: "Rot", v: "#FF1E1E" },
    { name: "Weiß", v: "#FFFFFF" },
    { name: "Gelb", v: "#FFD23F" },
    { name: "Cyan", v: "#00E5FF" },
    { name: "Schwarz", v: "#000000" },
    { name: "Grau", v: "#9E9E9E" },
    { name: "Blau", v: "#1E5BFF" },
    { name: "Dunkelblau", v: "#0A2A8C" },
    { name: "Grün", v: "#00C853" },
    { name: "Hellgrün", v: "#9EFF00" },
    { name: "Orange", v: "#FF8C00" },
    { name: "Violett", v: "#8E3BFF" },
    { name: "Magenta", v: "#FF1EC8" },
    { name: "Braun", v: "#8B5A2B" }
  ],

  /* Stationen: Name, Format ("portrait" = hochkant, "landscape" = quer), Schritte mit Untertiteln.
     drawn: hier den Code aus „Code anzeigen" einfügen, damit die Zeichnung fest in der Datei steht. */
  stations: {
    1: station("Position 1", "landscape"),
    2: station("Position 2", "portrait"),
    3: station("Position 3", "landscape"),
    4: station("Position 4", "portrait"),
    5: station("Position 5", "landscape"),
    6: station("Position 6", "portrait"),
    7: station("Position 7", "landscape")
  }
};

/* Platzhalter-Schritte. Für echte Inhalte station(...) durch ein eigenes Objekt ersetzen:
   { name: "...", orient: "portrait", drawn: [], steps: [ { dur: 7, caption: { de: "..." } }, ... ] } */
function station(name, orient) {
  var steps = [];
  for (var i = 1; i <= 4; i++) {
    steps.push({ dur: 7, caption: { de: name + " · Schritt " + i } });
  }
  return { name: name, orient: orient, steps: steps, drawn: [] };
}

/* =====================================================================
   AB HIER NICHTS ÄNDERN
   ===================================================================== */
(function () {
  "use strict";
  var NS = "http://www.w3.org/2000/svg";
  var P = "arp6_";
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), svg = $("svg"), gridSvg = $("grid"), overlay = $("overlay");
  var animG = $("anim"), existingG = $("existing"), draftG = $("draft");
  var captionBox = $("caption"), captionSpan = captionBox.querySelector("span");
  var video = $("video"), fallback = $("fallback"), startScreen = $("start");
  var panel = $("calib"), mini = $("mini"), loupe = $("loupe"), lctx = loupe.getContext("2d");

  if (CONFIG.fit === "cover") document.body.classList.add("cover");
  if (!CONFIG.showCaptions) captionBox.style.display = "none";
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function lsGet(k, d) { try { var v = JSON.parse(localStorage.getItem(P + k)); return v == null ? d : v; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(P + k, JSON.stringify(v)); } catch (e) {} }
  function tr(o, lang) {
    if (o == null) return "";
    if (typeof o === "string") return o;
    return o[lang] || o.de || o.en || o.es || Object.keys(o).map(function (k) { return o[k]; })[0] || "";
  }

  /* ---------- Referenzbilder (IndexedDB) ---------- */
  var db = null;
  function dbOpen() {
    return new Promise(function (res) {
      try {
        var rq = indexedDB.open("arp6", 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore("refs"); };
        rq.onsuccess = function () { db = rq.result; res(); };
        rq.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }
  function refGet(n) {
    return new Promise(function (res) {
      if (!db) return res(null);
      try { var rq = db.transaction("refs").objectStore("refs").get(String(n));
        rq.onsuccess = function () { res(rq.result || null); }; rq.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  function refPut(n, val) {
    return new Promise(function (res) {
      if (!db) return res(false);
      try { var tx = db.transaction("refs", "readwrite");
        if (val) tx.objectStore("refs").put(val, String(n)); else tx.objectStore("refs").delete(String(n));
        tx.oncomplete = function () { res(true); }; tx.onerror = function () { res(false); };
      } catch (e) { res(false); }
    });
  }

  /* ---------- Zustand ---------- */
  var stNo = String(lsGet("station", "1"));
  if (!CONFIG.stations[stNo]) stNo = "1";
  var ST, W, H, stored, cal, refData = null;
  var drawActive = false, forceFallback = false, camLive = false;

  function loadStation(n) {
    stNo = String(n);
    ST = CONFIG.stations[stNo];
    var portrait = ST.orient === "portrait";
    W = portrait ? 1080 : 1440; H = portrait ? 1440 : 1080;
    document.body.classList.toggle("portrait", portrait);
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    gridSvg.setAttribute("viewBox", "0 0 " + W + " " + H);
    stored = lsGet("s" + stNo + "_drawn", []);
    cal = lsGet("s" + stNo + "_cal", { x: 0, y: 0, s: 1, r: 0 });
    buildGrid(); applyCal(); fillStepSelects(); buildScene();
  }
  function saveDrawn() { lsSet("s" + stNo + "_drawn", stored); }
  function allDrawn() { return (ST.drawn || []).concat(stored); }

  /* ---------- Elemente ---------- */
  function mkEl(it, lang) {
    var el, col = it.col || CONFIG.colors[0].v;
    if (it.kind === "path") {
      el = document.createElementNS(NS, "path");
      el.setAttribute("d", it.d);
      el.setAttribute("class", "line");
      el.style.stroke = col;
      el.setAttribute("pathLength", "1");
      el.style.strokeDasharray = "1";
      el.style.strokeDashoffset = "1";
    } else {
      el = document.createElementNS(NS, "text");
      el.setAttribute("x", it.x); el.setAttribute("y", it.y);
      el.setAttribute("text-anchor", it.anchor || "start");
      el.setAttribute("class", "lbl");
      el.style.fill = it.col || "#FFFFFF";
      el.textContent = tr(it.text, lang);
    }
    return el;
  }

  function timeline(entries, stepNo) {
    var cursor = 0.4, out = [];
    entries.forEach(function (e) {
      if (e.step !== stepNo) return;
      var it = {}; for (var k in e) it[k] = e[k];
      if (e.kind === "path") {
        it.dur = e.tick ? 0.25 : clamp((e.len || 300) / 600, 0.35, 1.5);
        it.at = cursor; cursor += it.dur + (e.tick ? 0.05 : 0.15);
      } else { it.dur = 0.4; it.at = cursor; cursor += 0.6; }
      out.push(it);
    });
    return { items: out, end: cursor };
  }

  function demoItems(idx) {
    if (idx === 0) return [
      { kind: "path", d: "M" + Math.round(W * .17) + " " + Math.round(H * .74) + " H" + Math.round(W * .83), at: .3, dur: 1.4 },
      { kind: "text", x: Math.round(W / 2), y: Math.round(H * .74) - 34, anchor: "middle", text: "Beispiel: 920 mm", col: "#FFFFFF", at: 1.9, dur: .4 } ];
    if (idx === 1) return [
      { kind: "path", d: "M" + Math.round(W * .55) + " " + Math.round(H * .25) + " H" + Math.round(W * .86) + " V" + Math.round(H * .58) + " H" + Math.round(W * .55) + " Z", at: .3, dur: 1.4 },
      { kind: "text", x: Math.round(W * .705), y: Math.round(H * .25) - 30, anchor: "middle", text: "Beispiel: Bereich", col: "#FFFFFF", at: 1.8, dur: .4 } ];
    return [];
  }

  /* ---------- Szene ---------- */
  var total = 0, t0 = performance.now(), currentStep = null, currentLang = null;
  function buildScene() {
    animG.innerHTML = ""; total = 0;
    var d = allDrawn();
    ST.steps.forEach(function (step, idx) {
      var tl = timeline(d, idx + 1);
      step.items = d.length === 0 ? demoItems(idx) : tl.items;
      step.len = Math.max(step.dur, tl.end + 2.2);
      step.start = total; total += step.len;
      step.g = document.createElementNS(NS, "g"); step.g.style.display = "none";
      animG.appendChild(step.g);
      step.items.forEach(function (it) { var el = mkEl(it, CONFIG.langs[0]); el.style.opacity = "0"; it.el = el; step.g.appendChild(el); });
    });
    total += CONFIG.pause;
    currentStep = null; currentLang = null; t0 = performance.now();
  }

  function frame(now) {
    if (!drawActive && total > 0) {
      var el = (now - t0) / 1000;
      var loop = Math.floor(el / total), t = el % total;
      var lang = CONFIG.langs[loop % CONFIG.langs.length];
      var step = null;
      for (var i = 0; i < ST.steps.length; i++) {
        var s = ST.steps[i];
        if (t >= s.start && t < s.start + s.len) { step = s; break; }
      }
      if (step !== currentStep || lang !== currentLang) {
        if (currentStep && currentStep !== step) currentStep.g.style.display = "none";
        currentStep = step; currentLang = lang;
        if (step) {
          step.g.style.display = "";
          step.items.forEach(function (it) { if (it.kind === "text") it.el.textContent = tr(it.text, lang); });
          captionSpan.textContent = tr(step.caption, lang);
          captionBox.style.opacity = captionSpan.textContent ? "1" : "0";
        } else captionBox.style.opacity = "0";
      }
      if (step) {
        var local = t - step.start;
        var out = clamp((step.len - local) / CONFIG.fadeOut, 0, 1);
        if (out < 1) captionBox.style.opacity = String(out);
        step.items.forEach(function (it) {
          var p = clamp((local - (it.at || 0)) / (it.dur || 0.6), 0, 1);
          if (it.kind === "path") {
            it.el.style.strokeDashoffset = String(1 - p);
            it.el.style.opacity = p > 0 ? String(out) : "0";
          } else it.el.style.opacity = String(p * out);
        });
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- Ausrichtung ---------- */
  function applyCal() {
    overlay.setAttribute("transform",
      "translate(" + (W / 2 + cal.x) + " " + (H / 2 + cal.y) + ") rotate(" + cal.r + ") scale(" + cal.s + ") translate(" + (-W / 2) + " " + (-H / 2) + ")");
    $("vx").textContent = cal.x; $("vy").textContent = cal.y;
    $("vs").textContent = (+cal.s).toFixed(3); $("vr").textContent = (+cal.r).toFixed(2);
    $("rx").value = cal.x; $("ry").value = cal.y; $("rs").value = cal.s; $("rr").value = cal.r;
  }
  [["rx", "x"], ["ry", "y"], ["rs", "s"], ["rr", "r"]].forEach(function (p) {
    $(p[0]).addEventListener("input", function (e) { cal[p[1]] = parseFloat(e.target.value); applyCal(); lsSet("s" + stNo + "_cal", cal); });
  });
  $("reset").addEventListener("click", function () { cal = { x: 0, y: 0, s: 1, r: 0 }; applyCal(); lsSet("s" + stNo + "_cal", cal); });

  function buildGrid() {
    var html = "";
    for (var x = 0; x <= W; x += 120) html += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + H + '"/>';
    for (var y = 0; y <= H; y += 120) html += '<line x1="0" y1="' + y + '" x2="' + W + '" y2="' + y + '"/>';
    $("gridlines").innerHTML = html;
  }
  $("gridToggle").addEventListener("change", function (e) { gridSvg.classList.toggle("show", e.target.checked); });

  /* ---------- Menü + PIN ---------- */
  function openPanel() {
    panel.classList.add("show"); panel.classList.remove("hidden");
    document.body.classList.remove("kiosk"); updateStatus(); updateMini();
  }
  function closePanel() {
    panel.classList.remove("show"); panel.classList.remove("hidden");
    document.body.classList.add("kiosk");
    gridSvg.classList.remove("show"); $("gridToggle").checked = false;
    $("dActive").checked = false; setDrawActive(false); updateMini();
  }
  var pinBuf = "";
  function askPin() {
    if (!CONFIG.pin) { openPanel(); return; }
    pinBuf = ""; $("pinDots").textContent = ""; $("pin").classList.add("show");
  }
  Array.prototype.forEach.call(document.querySelectorAll("#pin .keys button"), function (b) {
    b.addEventListener("click", function () {
      var k = b.getAttribute("data-k");
      if (k === "x") { $("pin").classList.remove("show"); return; }
      if (k === "b") pinBuf = pinBuf.slice(0, -1); else pinBuf += b.textContent;
      $("pinDots").textContent = pinBuf.replace(/./g, "●");
      if (pinBuf.length >= CONFIG.pin.length) {
        if (pinBuf === CONFIG.pin) { $("pin").classList.remove("show"); openPanel(); }
        else { pinBuf = ""; $("pinDots").textContent = "falsch"; }
      }
    });
  });
  function togglePanel() { if (panel.classList.contains("show")) { if (panel.classList.contains("hidden")) { panel.classList.remove("hidden"); updateMini(); } else closePanel(); } else askPin(); }
  $("done").addEventListener("click", closePanel);
  var corner = $("corner"), pressTimer = null;
  function pressStart() { clearTimeout(pressTimer); pressTimer = setTimeout(togglePanel, 1500); }
  function pressEnd() { clearTimeout(pressTimer); }
  corner.addEventListener("touchstart", pressStart, { passive: true });
  corner.addEventListener("touchend", pressEnd); corner.addEventListener("touchcancel", pressEnd);
  corner.addEventListener("mousedown", pressStart); corner.addEventListener("mouseup", pressEnd); corner.addEventListener("mouseleave", pressEnd);
  document.addEventListener("keydown", function (e) { if ((e.key === "c" || e.key === "C") && !$("pin").classList.contains("show")) togglePanel(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });

  /* Station */
  Object.keys(CONFIG.stations).forEach(function (k) {
    var o = document.createElement("option"); o.value = k;
    o.textContent = k + " – " + CONFIG.stations[k].name + " (" + (CONFIG.stations[k].orient === "portrait" ? "hochkant" : "quer") + ")";
    $("station").appendChild(o);
  });
  $("station").addEventListener("change", function (e) {
    lsSet("station", e.target.value);
    switchStation(e.target.value);
  });
  function switchStation(n) {
    $("station").value = n;
    var wasDraw = drawActive;
    loadStation(n);
    refGet(stNo).then(function (r) { refData = r; applyFallbackImage(); updateStatus(); });
    if (wasDraw) renderExisting();
    setHint("Station " + n + " geladen.");
  }

  function updateStatus() {
    if (!panel.classList.contains("show")) return;
    var sw = ("serviceWorker" in navigator) && navigator.serviceWorker.controller ? "bereit ✓" : "NICHT aktiv ✗";
    var cam = camLive ? "live " + video.videoWidth + "×" + video.videoHeight + " ✓" : (forceFallback ? "Ausfall simuliert" : "aus ✗");
    var ref = refData ? "vorhanden ✓ (" + (refData.date || "") + ")" : "fehlt ✗";
    var lines = [
      "Version:   " + CONFIG.version,
      "Station:   " + stNo + " – " + ST.name + " (" + (ST.orient === "portrait" ? "hochkant" : "quer") + ")",
      "Kamera:    " + cam,

  function stopTracks() { try { if (video.srcObject) video.srcObject.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {} video.srcObject = null; }
  function showStart(msg, alt) {
    startScreen.style.display = "flex";
    if (msg) $("startMsg").textContent = msg;
    $("startAlt").style.display = alt ? "inline-block" : "none";
  }
  function startCamera(silent) {
    if (camBusy) return Promise.resolve();
    lastTry = Date.now();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      noCamera("Kein Kamerazugriff möglich. Die App muss über https:// installiert bzw. geöffnet werden (nicht als lokale Datei).", silent);
      return Promise.resolve();
    }
    camBusy = true; stopTracks();
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false })
      .then(function (stream) {
        camBusy = false; permDenied = false;
        video.srcObject = stream;
        var p = video.play(); if (p && p.catch) p.catch(function () {});
        stream.getVideoTracks()[0].addEventListener("ended", function () { camLive = false; updateFallback(); });
        startScreen.style.display = "none";
        keepAwake();
      })
      .catch(function (err) {
        camBusy = false;
        if (err && err.name === "NotAllowedError") permDenied = true;
        noCamera("Kamera nicht verfügbar oder nicht freigegeben. Bitte Kamerafreigabe erlauben und erneut tippen.", silent);
      });
  }
  function noCamera(msg, silent) {
    camLive = false; updateFallback();
    if (refData) { startScreen.style.display = "none"; return; }  /* Ersatzbild läuft weiter */
    if (!silent) showStart(msg, true);
  }
  /* Überwachung: friert das Bild ein oder fällt die Kamera aus, wird das Referenzbild gezeigt und neu verbunden */
  setInterval(function () {
    var live = !!video.srcObject && video.readyState >= 2 && video.currentTime !== lastT;
    if (live) {
      lastT = video.currentTime; stuckSince = 0;
      if (!camLive) { camLive = true; updateFallback(); setTimeout(function () { if (camLive && !refData) saveRef(true); }, 3000); }
    } else if (video.srcObject) {
      if (!stuckSince) stuckSince = Date.now();
      if (camLive && Date.now() - stuckSince > 6000) { camLive = false; updateFallback(); }
    }
    if (!camLive && !permDenied && Date.now() - lastTry > 15000) startCamera(true);
  }, 1000);

  function keepAwake() { try { if (navigator.wakeLock) navigator.wakeLock.request("screen").catch(function () {}); } catch (e) {} }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") { keepAwake(); if (!camLive) startCamera(true); }
  });
  $("startBtn").addEventListener("click", function (e) { e.stopPropagation(); permDenied = false; startCamera(false); });
  $("startAlt").addEventListener("click", function (e) { e.stopPropagation(); startScreen.style.display = "none"; updateFallback(); keepAwake(); });

  /* ---------- Export / Import ---------- */
  $("exp").addEventListener("click", function () {
    var d = new Date(), ds = d.toISOString().slice(0, 10);
    var data = { app: "ar-station", format: 1, version: CONFIG.version, exported: d.toISOString(), station: stNo,
      name: ST.name, orient: ST.orient, drawn: stored, cal: cal, ref: refData };
    var name = "AR-Station-" + stNo + "_" + ds + ".json";
    var json = JSON.stringify(data);
    var file = null;
    try { file = new File([json], name, { type: "application/json" }); } catch (e) {}
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).then(function () { setHint("Export geteilt: " + name); })
        .catch(function (e) { if (e && e.name !== "AbortError") download(json, name); });
    } else download(json, name);
  });
  function download(json, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setHint("Export heruntergeladen: " + name);
  }
  $("imp").addEventListener("click", function () { $("impFile").value = ""; $("impFile").click(); });
  $("impFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      var d; try { d = JSON.parse(rd.result); } catch (x) { setHint("Datei ist kein gültiger Export."); return; }
      if (!d || d.app !== "ar-station" || !CONFIG.stations[d.station]) { setHint("Datei ist kein gültiger Export dieser App."); return; }
      if (!window.confirm("Station " + d.station + " (" + d.name + ", exportiert " + (d.exported || "").slice(0, 10) + ") übernehmen?\n\nÜberschreibt Zeichnungen, Ausrichtung und Referenzbild dieser Station auf diesem iPad und stellt das iPad auf Station " + d.station + ".")) return;
      lsSet("s" + d.station + "_drawn", d.drawn || []);
      lsSet("s" + d.station + "_cal", d.cal || { x: 0, y: 0, s: 1, r: 0 });
      lsSet("station", String(d.station));
      refPut(d.station, d.ref || null).then(function () { switchStation(String(d.station)); setHint("Import von Station " + d.station + " abgeschlossen."); });
    };
    rd.readAsText(f);
  });

  /* ---------- Offline-Betrieb (Service Worker) ---------- */
  if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  }

  /* ---------- Start ---------- */
  loadStation(stNo);
  $("station").value = stNo;
  updateHint();
  requestAnimationFrame(frame);
  dbOpen().then(function () { return refGet(stNo); }).then(function (r) {
    refData = r; applyFallbackImage();
    startCamera(false);
  });
})();
</script>
</body>
</html>
